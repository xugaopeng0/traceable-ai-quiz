name: ${COMPOSE_PROJECT_NAME:?请先复制 .env.example 为 .env}

x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    GO_IMAGE: ${GO_IMAGE:?缺少 GO_IMAGE}
    NODE_IMAGE: ${NODE_IMAGE:?缺少 NODE_IMAGE}
    NGINX_IMAGE: ${NGINX_IMAGE:?缺少 NGINX_IMAGE}
    ALPINE_IMAGE: ${ALPINE_IMAGE:?缺少 ALPINE_IMAGE}

x-common-env: &common-env
  APP_ENV: ${APP_ENV:?缺少 APP_ENV}
  APP_NAME: ${APP_NAME:?缺少 APP_NAME}
  APP_VERSION: ${APP_VERSION:?缺少 APP_VERSION}
  BUILD_COMMIT: ${BUILD_COMMIT:?缺少 BUILD_COMMIT}
  LOG_LEVEL: ${LOG_LEVEL:?缺少 LOG_LEVEL}
  API_PORT: ${API_PORT:?缺少 API_PORT}
  SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:?缺少 SHUTDOWN_TIMEOUT_SECONDS}

x-health: &health
  interval: ${HEALTHCHECK_INTERVAL:?缺少 HEALTHCHECK_INTERVAL}
  timeout: ${HEALTHCHECK_TIMEOUT:?缺少 HEALTHCHECK_TIMEOUT}
  retries: ${HEALTHCHECK_RETRIES:?缺少 HEALTHCHECK_RETRIES}
  start_period: ${HEALTHCHECK_START_PERIOD:?缺少 HEALTHCHECK_START_PERIOD}

services:
  api:
    image: ${COMPOSE_PROJECT_NAME}-api:${APP_VERSION}
    build:
      <<: *build
      target: api
    environment:
      <<: *common-env
      API_LISTEN_HOST: ${API_LISTEN_HOST:?缺少 API_LISTEN_HOST}
      HTTP_READ_TIMEOUT_SECONDS: ${HTTP_READ_TIMEOUT_SECONDS:?缺少 HTTP_READ_TIMEOUT_SECONDS}
      HTTP_WRITE_TIMEOUT_SECONDS: ${HTTP_WRITE_TIMEOUT_SECONDS:?缺少 HTTP_WRITE_TIMEOUT_SECONDS}
      HTTP_IDLE_TIMEOUT_SECONDS: ${HTTP_IDLE_TIMEOUT_SECONDS:?缺少 HTTP_IDLE_TIMEOUT_SECONDS}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: ${STOP_GRACE_PERIOD:?缺少 STOP_GRACE_PERIOD}
    healthcheck:
      <<: *health
      test: [CMD, /app/api, -healthcheck]
  web:
    image: ${COMPOSE_PROJECT_NAME}-web:${APP_VERSION}
    build:
      <<: *build
      target: web
    environment:
      <<: *common-env
      API_HOST: ${API_HOST:?缺少 API_HOST}
      WEB_LISTEN_PORT: ${WEB_LISTEN_PORT:?缺少 WEB_LISTEN_PORT}
      PROXY_TIMEOUT_SECONDS: ${PROXY_TIMEOUT_SECONDS:?缺少 PROXY_TIMEOUT_SECONDS}
      PROXY_CONNECT_TIMEOUT_SECONDS: ${PROXY_CONNECT_TIMEOUT_SECONDS:?缺少 PROXY_CONNECT_TIMEOUT_SECONDS}
      PUBLIC_HEALTH_TIMEOUT_MS: ${PUBLIC_HEALTH_TIMEOUT_MS:?缺少 PUBLIC_HEALTH_TIMEOUT_MS}
    ports:
      - ${WEB_BIND_HOST:?缺少 WEB_BIND_HOST}:${WEB_PORT:?缺少 WEB_PORT}:${WEB_LISTEN_PORT}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: ${STOP_GRACE_PERIOD}
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'wget -q -O /dev/null "http://127.0.0.1:$$WEB_LISTEN_PORT/health"']
